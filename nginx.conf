server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  # Runtime config is regenerated per deploy and is NOT content-hashed — never
  # cache it, or clients pin a stale (or empty) config. Exact match beats the
  # generic static-asset regex below.
  location = /config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }
  location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location /healthz { access_log off; return 200 "ok\n"; }
}
